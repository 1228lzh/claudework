server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/clue_hub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 文件上传存储路径
app:
  upload-path: E:/AI/claudeWork/clue-hub/backend/uploads
  # 企微配置（待替换为实际值）
  wecom:
    corp-id: your_corp_id
    agent-id: your_agent_id
    secret: your_secret
