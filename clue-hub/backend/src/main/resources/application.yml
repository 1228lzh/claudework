server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/clue_hub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 应用配置
app:
  # 文件存储类型：local=本地文件系统，minio=MinIO 对象存储
  storage-type: local
  upload-path: E:/AI/claudeWork/clue-hub/backend/uploads
  # MinIO 配置（仅 storage-type=minio 时生效）
  minio:
    endpoint:
    access-key:
    secret-key:
    bucket: clue-hub
  # 企微配置（待替换为实际值）
  wecom:
    corp-id: your_corp_id
    agent-id: your_agent_id
    secret: your_secret

# 飞连 SSO Oauth2 配置
feilian:
  base-uri: https://auth.rifeng.com:10443/api
  client-id: ${FEILIAN_CLIENT_ID:}
  client-secret: ${FEILIAN_CLIENT_SECRET:}
  redirect-uri: ${FEILIAN_REDIRECT_URI:http://10.1.32.30:5173/auth/callback}
  post-logout-redirect-uri: ${FEILIAN_POST_LOGOUT_REDIRECT_URI:http://10.1.32.30:5173/}
  admin-ids: ${FEILIAN_ADMIN_IDS:50002062,814812,815725,50004292,813200,813423}
